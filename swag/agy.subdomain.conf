# ==============================================================================
# SWAG Reverse Proxy Configuration for ATHX 2027 / AGY
# ==============================================================================
# Place this file in your SWAG config directory:
#   /config/nginx/proxy-confs/agy.subdomain.conf
#
# Requirements:
#   1. Set a DNS CNAME or A record for 'agy' pointing to your server:
#      e.g., agy.yourdomain.com -> yourdomain.com
#   2. Ensure the 'agy' container is running on the 'lsio' docker network.
#   3. Ensure client_max_body_size is large enough for Apple Health JSON payloads.
# ==============================================================================

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name agy.*;

    include /config/nginx/ssl.conf;

    # Set to 50M (or 0 for unlimited) to allow large Health Auto Export biometrics uploads
    client_max_body_size 50M;

    # Optional global authentication integrations (Authelia / Authentik / LDAP)
    # enable for ldap auth (requires ldap-server.conf in the server block)
    #include /config/nginx/ldap-server.conf;

    # enable for Authelia (requires authelia-server.conf in the server block)
    #include /config/nginx/authelia-server.conf;

    # enable for Authentik (requires authentik-server.conf in the server block)
    #include /config/nginx/authentik-server.conf;

    # enable for Tinyauth (requires tinyauth-server.conf in the server block)
    #include /config/nginx/tinyauth-server.conf;

    # --------------------------------------------------------------------------
    # 1. MAIN UI LOCATION: ATHX Athlete Dashboard & Multi-Calendar
    # --------------------------------------------------------------------------
    location / {
        # Enable HTTP Basic Auth if desired:
        #auth_basic "Restricted Access";
        #auth_basic_user_file /config/nginx/.htpasswd;

        # Enable Authelia SSO if desired:
        #include /config/nginx/authelia-location.conf;

        # Enable Authentik SSO if desired:
        #include /config/nginx/authentik-location.conf;

        # Enable IP restriction if desired:
        #include /config/nginx/local_access_only.conf;

        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app agy;
        set $upstream_port 8080;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }

    # --------------------------------------------------------------------------
    # 2. WEBHOOK & API LOCATION: iOS Health Auto Export & Healthcheck
    # --------------------------------------------------------------------------
    # IMPORTANT: Keep this block publicly accessible (no interactive SSO modal)
    # so that background iOS Shortcuts / Health Auto Export syncing works uninterrupted!
    location /api/ {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app agy;
        set $upstream_port 8080;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }

    # Healthcheck endpoint (used by uptime monitors & health checks)
    location /health {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app agy;
        set $upstream_port 8080;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
