<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meeting Hub · Prep · Capture · Link</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="ui/styles.css">
</head>
<body>

  <!-- App Shell: Dark Navy Sidebar -->
  <aside></aside>

  <!-- Main View Area -->
  <main>
    <header></header>
    <div class="body">
      <!-- Left Column: Primary View (Today Timeline & Prep) -->
      <section class="col" id="left">
        <div class="loading-box">
          <div class="spinner"></div>
          <div>Loading meetings…</div>
        </div>
      </section>

      <!-- Expand Meeting Panel Handle (Shown when panel is collapsed) -->
      <button class="panel-expand-tab" id="expandPanelTab" title="Expand meeting panel" aria-label="Expand meeting panel">
        <svg class="i" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M15 3v18"/><path d="m11 15-3-3 3-3"/></svg>
        <span>Meeting Details</span>
      </button>

      <!-- Right Column: Meeting Detail & Actions Drawer -->
      <section class="col right" id="right"></section>
    </div>
  </main>

  <!-- Global Seed Events (Pre-loaded to prevent file:// CORS restrictions) -->
  <script src="data/initial_events.js"></script>
  <!-- Missions Registry Snapshot (file:// fallback) -->
  <script src="data/missions_snapshot.js"></script>

  <!-- Meeting Hub Application Engine -->
  <script src="meeting_hub.app.js"></script>
</body>
</html>
